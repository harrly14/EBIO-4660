<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Photo credits</title>
<style>
  :root { --bg:#f3f6fb; --panel:#fff; --panel2:#edf3fb; --text:#1f2d3d; --muted:#5b6c83; --accent:#2d7a67; --bad:#cd5b5b; --line:#dfe8f5; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1400px; margin: auto; padding: 18px; display: grid; grid-template-columns: 380px 1fr; gap: 18px; }
  header { max-width: 1400px; margin: auto; padding: 18px 18px 0; display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 1.5rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stack { display: grid; gap: 12px; align-content: start; }
  .local img { width: 100%; max-height: 360px; object-fit: contain; background: var(--panel2); border-radius: 10px; }
  .muted { color: var(--muted); font-size: .9rem; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
  input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); color: var(--text); }
  button { font: inherit; cursor: pointer; border-radius: 10px; padding: 8px 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
  button.primary { background: var(--accent); color: #fff; border: 0; font-weight: 700; }
  button.danger { background: var(--bad); color: #fff; border: 0; font-weight: 700; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input { flex: 1; min-width: 160px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .candidate { display: grid; gap: 6px; align-content: start; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; font-size: .82rem; }
  .candidate.selected { border: 2px solid var(--accent); }
  .candidate img { width: 100%; height: 160px; object-fit: contain; background: var(--panel); border-radius: 8px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: #fff; font-size: .72rem; font-weight: 700; }
  .badge.hint { background: #4b6bb3; }
  .similarity { font-weight: 700; }
  .status { min-height: 1.2em; }
  .error { color: var(--bad); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Photo credits</h1>
  <span class="muted" data-role="progress"></span>
</header>
<main>
  <section class="stack">
    <div class="card local stack">
      <img data-role="local-image" alt="Photo needing a credit">
      <div><strong data-role="taxon"></strong> <span class="muted" data-role="common-name"></span></div>
      <div class="muted" data-role="src"></div>
      <div class="row muted" data-role="reverse-links"></div>
    </div>
    <form class="card stack" data-role="credit-form">
      <strong>Credit</strong>
      <span class="muted">Pick "This is it" on a matching result to fill these in, then check and save.</span>
      <label>Source page URL <input name="sourceUrl" required></label>
      <label>Title <input name="title" required></label>
      <label>Creator <input name="creator" required></label>
      <label>License <input name="license" required></label>
      <div class="row">
        <button class="primary" type="submit">Save credit</button>
        <button class="danger" type="button" data-action="remove">Move on (remove photo)</button>
      </div>
      <div class="status" data-role="form-status"></div>
    </form>
  </section>
  <section class="card stack">
    <form class="row" data-role="search-form">
      <input name="query" aria-label="Search Wikimedia Commons">
      <button class="primary" type="submit">Search Commons</button>
      <span class="row" data-role="query-chips"></span>
    </form>
    <form class="row" data-role="lookup-form">
      <input name="url" placeholder="Or paste a Commons file link found elsewhere">
      <button type="submit">Look up</button>
    </form>
    <div class="status muted" data-role="search-status"></div>
    <div class="grid" data-role="candidates"></div>
    <div class="row"><button type="button" data-action="more">Not here: show more results</button></div>
  </section>
</main>
<script type="module" src="client.js"></script>
</body>
</html>
